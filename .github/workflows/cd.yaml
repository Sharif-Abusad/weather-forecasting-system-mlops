name: CD — Build & Deploy to Render

on:
  push:
    tags:
      - "v*.*.*"   # triggers on v1.0.0, v1.2.3 etc.

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install DVC
        run: pip install dvc[http]

      - name: Pull models from DagsHub
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user ${{ secrets.DAGSHUB_USER }}
          dvc remote modify origin --local password ${{ secrets.DAGSHUB_TOKEN }}
          dvc pull deployment

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/weather-forecast-mlops:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/weather-forecast-mlops:${{ github.ref_name }}

  deploy-to-render:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Trigger Render deployment
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys"

      - name: Notify deployment
        run: |
          echo "Deployed version ${{ github.ref_name }} to Render"
          echo "Docker image: ${{ secrets.DOCKERHUB_USERNAME }}/weather-forecast-mlops:${{ github.ref_name }}"