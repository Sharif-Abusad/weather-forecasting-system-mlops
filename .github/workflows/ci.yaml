name: CI — Test & Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Install package
        run: pip install -e .

      - name: Lint with flake8
        run: |
          # Stop on real errors only (E9=syntax, F63=assert, F7=undefined, F82=undefined name)
          flake8 src/ app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues but don't fail
          flake8 src/ app/ --count --exit-zero --max-line-length=120 --statistics

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
        continue-on-error: true   # don't fail CI if tests are empty yet

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t weather-forecast-mlops:latest .