data:
  # ERA5 CDS API — Azamgarh, Uttar Pradesh
  latitude: 26.00
  longitude: 83.00
  area: [26.32, 82.40, 25.38, 83.52]   # North, West, South, East
  years: ["2021", "2022", "2023", "2024", "2025"]
  timezone: Asia/Kolkata
 
  # Target location
  target_latitude: 26.00
  target_longitude: 83.00
 
  variables:
    - 2m_temperature
    - 2m_dewpoint_temperature
    - total_precipitation
    - surface_pressure
    - 10m_u_component_of_wind
    - 10m_v_component_of_wind
    - total_cloud_cover
    - low_cloud_cover
    - medium_cloud_cover
    - high_cloud_cover

feature_engineering:
  lag_hours: [1, 24]
  rolling_window: 6
  rain_threshold_mm: 1.0
  rain_lookahead_hours: 24
  
xgboost:
  n_estimators: 304
  max_depth: 3
  learning_rate: 0.2000597712440253
  subsample: 0.9090186258927353
  colsample_bytree: 0.6300398129828485
  min_child_weight: 1
  gamma: 0.4359601240080611
  reg_alpha: 0.5984311571268364
  reg_lambda: 1.5451562367416993

  use_label_encoder: False
  eval_metric: logloss
  early_stopping_rounds: 20
  random_state: 42
  n_jobs: -1

  threshold: 0.7

  features:
    - temperature
    - surface_pressure
    - total_cloud_cover
    - low_cloud_cover
    - medium_cloud_cover
    - high_cloud_cover
    - precipitation
    - humidity
    - wind_speed
    - temp_rolling_6
    - temp_lag_1
    - temp_lag_24
    - month

lstm:
  lookback: 24
  forecast_n: 5
  batch_size: 32
  epochs: 100
  patience: 10
  units: 64
  dropout: 0.21596778466458033
  learning_rate: 0.002497202586031813
  features:
    - temperature       
    - temp_lag_1        # autocorr ~0.99
    - temp_lag_24       # same hour yesterday
    - temp_rolling_6    # 6h smooth trend
    - humidity          
    - surface_pressure  
    - total_cloud_cover 
    - wind_speed        
    - hour_sin          # cyclic hour encoding
    - hour_cos
    - month_sin         # cyclic month encoding
    - month_cos

split:
  test_size: 0.20
  random_state: 42